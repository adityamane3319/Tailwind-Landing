<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Hero Landing Page</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body>

    <nav class="sticky top-0 z-50 flex justify-between items-center px-6 py-4 bg-white-100">
        <div>
            <h1 class="text-xl font-bold">✦︎ Project</h1>
        </div>

        <ul class="flex gap-6">
            <li><a href="#">Product</a></li>
            <li><a href="#">Solutions</a></li>
            <li><a href="#">Resources</a></li>
            <li><a href="#">Pricing</a></li>
            <li class="font-bold"><a href="#">Log In</a></li>
            <button type="button" class="bg-black px-2 py-1 text-white hover:bg-blue-400">Get AI Free</button>
        </ul>

    </nav>

    <section
        class="bg-gradient-to-br h-screen justify-center items-center from-orange-200 to-white h-full overflow-hidden">
        <div class="text-center">
            <h1 class="text-5xl font-bold">Write, Plan, Share.<br>With AI at your side.</h1>
            <br>
            <p>It is connected workspace where better, faster work happens. Now with AI.</p>
            <br>
            <button type="button" class="bg-black text-white px-4 py-1">Get AI Free→</button>
            <button type="button" class="bg-blue-500 text-white px-4 py-1">Request a Demo</button>
        </div>
        <br>
        <div class="relative w-full flex justify-center items-center">
            <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cGxhbm5pbmd8ZW58MHx8MHx8fDA%3D"
                alt="Dashboard" class="w-100 rounded-xl shadow-2xl z-10">

            <div class="absolute left-24 top-16 bg-white p-4 shadow-lg">
                <h3 class="font-bold">📋 Tasks</h3>
                <p class="text-sm text-gray-500">12 tasks completed today</p>
            </div>

            <div class="absolute right-28 top-10 bg-white p-4 shadow-lg">
                <h3 class="font-bold">✅ Project Status</h3>
                <p class="text-green-500 font-semibold">On Track</p>
            </div>

            <div class="absolute right-36 bottom-0 bg-white p-4 shadow-lg">
                <h3 class="font-bold">👥 Team Activity</h3>
                <p class="text-sm text-gray-500">5 members online</p>
            </div>

            <div class="fixed bottom-6 right-6 z-50">

                <button type="button" class="bg-black text-white p-4 rounded-full shadow-xl 
    hover:scale-110 transition">💬</button>

            </div>

        </div>


    </section>


</body>

</html>
